# VoiceOps CI: lint, test, build (Part 8).
#
# Backend tests run on SQLite via aiosqlite (no services needed); the full
# Postgres/pgvector + Redis stack is exercised by docker compose locally
# (see README → Local development).

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Lint backend
        run: ruff check backend/app backend/tests backend/eval
      - name: Lint migrations
        run: ruff check backend/migrations

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend + dev deps
        run: |
          pip install -e "backend[dev]" pydantic[email]
      - name: Run pytest
        run: cd backend && python -m pytest -q
      - name: Evaluation harness smoke run (keyword provider)
        run: cd backend && python -m eval.run_eval

  test-frontend:
    name: Tests (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run frontend integration tests
        run: node --test frontend/tests/api.test.mjs

  build:
    name: Build (docker)
    runs-on: ubuntu-latest
    needs: [lint, test, test-frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t voiceops-backend ./backend
      - name: Build frontend image
        run: docker build -t voiceops-frontend ./frontend
      - name: Validate compose file
        run: docker compose config --quiet
