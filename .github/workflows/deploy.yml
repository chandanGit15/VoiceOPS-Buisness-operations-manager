# VoiceOps Cloud Run deploy workflow (Part 9).
#
# Prerequisites (one-time, done locally — see README → Production deployment):
#   gcloud run services replace cloudrun/service.yaml ...   # schema with secretKeyRefs
#   ./scripts/create_secrets.sh                             # Secret Manager values
#
# Secrets / variables configured on the GitHub repo:
#   GCP_PROJECT_ID, GCP_REGION, GCP_WORKLOAD_IDP, GCP_WORKLOAD_IDP_PROVIDER
#   (Workload Identity Federation — a key-file-less auth path. No GCP keys in git.)
#
# Manual dispatch only (workflow_dispatch), so production updates are an
# explicit decision. CI must already pass on main before this runs.

name: Deploy

on:
  workflow_dispatch:
    inputs:
      migrate:
        description: "Run Alembic migrations before deploying"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write   # Workload Identity Federation

jobs:
  tests:
    name: Tests (lint + pytest + frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend + dev deps
        run: pip install -e "backend[dev]" pydantic[email]
      - name: Lint
        run: ruff check backend/app backend/tests backend/eval backend/migrations
      - name: Backend pytest
        run: cd backend && python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Frontend tests
        run: node --test frontend/tests/api.test.mjs

  build-and-push:
    name: Build & push images
    runs-on: ubuntu-latest
    needs: [tests]
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDP_PROVIDER }}
          project_number: ${{ vars.GCP_PROJECT_NUMBER }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker registry
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Build backend image
        id: image
        run: |
          IMAGE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/voiceops/voiceops-backend:${GITHUB_SHA::12}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          docker build -t "$IMAGE" ./backend

      - name: Push backend image
        run: docker push "$IMAGE"

      - name: Build frontend image (for record / optional artifact push)
        run: docker build -t voiceops-frontend ./frontend

  migrate:
    name: Run Alembic migrations (Cloud SQL)
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: ${{ inputs.migrate }}
    env:
      POSTGRES_HOST: ${{ vars.POSTGRES_HOST }}
      POSTGRES_PORT: "5432"
      POSTGRES_USER: voiceops
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: voiceops
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend + migrations
        run: pip install -e "backend" psycopg2-binary
      - name: Apply migrations
        working-directory: backend
        run: alembic upgrade head

  deploy:
    name: Deploy backend to Cloud Run
    runs-on: ubuntu-latest
    needs: [build-and-push, migrate]
    if: ${{ always() && needs['build-and-push'].result == 'success' && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped') }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDP_PROVIDER }}
          project_number: ${{ vars.GCP_PROJECT_NUMBER }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy voiceops-backend \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --region="${{ vars.GCP_REGION }}" \
            --image="${{ needs.build-and-push.outputs.image }}" \
            --quiet

  post-deploy-check:
    name: Post-deploy health check
    runs-on: ubuntu-latest
    needs: [deploy]
    steps:
      - name: Wait for the service to come healthy
        run: |
          URL="${{ vars.BACKEND_URL }}"
          for i in $(seq 1 24); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "https://$URL/api/v1/health") || code=000
            if [ "$code" = "200" ]; then
              echo "health OK"
              exit 0
            fi
            sleep 5
          done
          echo "health probe failed (last status: $code)"
          exit 1
