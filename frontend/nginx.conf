# VoiceOps frontend nginx config:
# - serves the static site from /usr/share/nginx/html
# - proxies /api/v1 to the backend service (compose network name)
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static assets
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API → backend (compose service name). Note: the app's CORS config
    # stays authoritative; the proxy simply avoids cross-origin requests
    # in the default local topology.
    location /api/v1/ {
        proxy_pass http://backend:8000/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;   # agent turns can take a while
    }
}
