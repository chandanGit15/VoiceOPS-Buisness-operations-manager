# VoiceOps backend — Cloud Run service definition (Part 9).
#
# Deploy with:
#   gcloud run services replace cloudrun/service.yaml --region=REGION
#
# Secret values are never written here. They resolve from Secret Manager via
# secretKeyRef (created by scripts/create_secrets.sh — see README).
#
# Alternatively deploy with the GitHub Actions workflow in
# .github/workflows/deploy.yml, which builds, pushes and deploys this
# service-for-schema automatically.

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: voiceops-backend
  labels:
    cloud.googleapis.com/location: REGION            # set your region
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"        # scale to zero for a demo
        autoscaling.knative.dev/maxScale: "5"
        run.googleapis.com/startup-cpu-boost: "true"
        run.googleapis.com/execution-environment: gen1
    spec:
      containerConcurrency: 40
      serviceAccountName: voiceops-runtime@PROJECT_ID.iam.gserviceaccount.com
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/voiceops/voiceops-backend:latest
          ports:
            - name: http1
              containerPort: 8080                    # matches ENV PORT in Dockerfile
          env:
            - name: APP_ENV
              value: production
            - name: LOG_LEVEL
              value: info
            - name: PORT
              value: "8080"
            - name: GEMINI_MODEL
              value: gemini-2.5-flash
            - name: EMBEDDING_MODEL
              value: text-embedding-004
            # --- Secrets (values only in Secret Manager) ---
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: voiceops-gemini-api-key
                  key: latest
            - name: APP_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: voiceops-app-secret-key
                  key: latest
            - name: TOKEN_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: voiceops-token-encryption-key
                  key: latest
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: voiceops-postgres-password
                  key: latest
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: voiceops-database-url
                  key: latest
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: voiceops-redis-url
                  key: latest
            # --- Optional integrations (add secrets as needed) ---
            # - name: GOOGLE_CLIENT_ID
            # - name: GOOGLE_CLIENT_SECRET
            # - name: GOOGLE_REDIRECT_URI
            # - name: DEEPGRAM_API_KEY
            # - name: ELEVENLABS_API_KEY
            # - name: TAVILY_API_KEY
            # - name: SENTRY_DSN
            #   valueFrom:
            #     secretKeyRef:
            #       name: voiceops-sentry-dsn
            #       key: latest
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          # Startup probe hits the fast liveness endpoint; the readiness
          # probe additionally confirms the database and migrations.
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            failureThreshold: 20
            periodSeconds: 5      # ~100s max startup window
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
  traffic:
    - percent: 100
      latestRevision: true
