[project]
name = "voiceops-backend"
version = "0.1.0"
description = "VoiceOps backend: multi-agent voice AI operations platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "google-genai>=1.0",
    "langgraph>=0.2",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
    "greenlet>=3.0",
    "python-multipart>=0.0.9",
    "cryptography>=42.0",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "pgvector>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
    "ruff>=0.6",
]
monitoring = [
    "sentry-sdk[opentelemetry]>=2.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # long lines allowed; this codebase favors readability over wrapping

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
